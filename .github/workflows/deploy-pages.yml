name: Deploy Personal PDF Vault to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site files
        run: |
          mkdir -p public
          cat bundle/part{01..12} | base64 -d | tar -xJ -C public
          test -f public/index.html
      - name: Inspect generated upload flow (temporary)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ["public/modules/github.js", "public/app.js"]:
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              lines = source.splitlines()
              print(f"\\n===== {filename} =====")
              needles = ("upload", "release") if filename.endswith("github.js") else ("processSelectedFiles", "appendEncryptedDownloads", "uploadEncryptedPair")
              indexes = [i for i,line in enumerate(lines) if any(word in line.lower() for word in needles) and ("async " in line or "function " in line or "=>" in line)]
              seen = set()
              for i in indexes[:12]:
                  start=max(0,i-2); end=min(len(lines),i+55)
                  if any(j in seen for j in range(start,end)): continue
                  seen.update(range(start,end))
                  print(f"\\n--- lines {start+1}-{end} ---")
                  print("\\n".join(f"{j+1}: {lines[j]}" for j in range(start,end)))
          PY
      - name: Build public Vault index with GitHub Actions token
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build-public-index.py public/vault-index.json

      - name: Install PDF.js canvas reader
        run: |
          mkdir -p public/vendor/pdfjs
          curl -fsSL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js -o public/vendor/pdfjs/pdf.min.js
          curl -fsSL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js -o public/vendor/pdfjs/pdf.worker.min.js
          curl -fsSL --retry 3 https://raw.githubusercontent.com/mozilla/pdf.js/v3.11.174/LICENSE -o public/vendor/pdfjs/LICENSE
          test -s public/vendor/pdfjs/pdf.min.js
          test -s public/vendor/pdfjs/pdf.worker.min.js
      - name: Fix public Release asset downloads
        run: |
          python3 patch-release-download.py
          node --input-type=module --check < public/app.js
          grep -q 'pdfjsLib.getDocument' public/app.js
          ! grep -q 'iframe class="reader-frame"' public/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
